name: Unit Test Coverage Computation for Avatica

on:
  workflow_dispatch:  # allows manual triggering

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 #get all

      # Step 2: Set up Java
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Install fake avatica tests jar (CI workaround)
        run: |
          mkdir -p /tmp/empty
          echo "dummy" > /tmp/empty/dummy.txt
          jar cf /tmp/avatica-tests.jar -C /tmp/empty .

          mvn install:install-file \
            -DgroupId=org.apache.calcite.avatica \
            -DartifactId=avatica \
            -Dversion=1.9.0-SNAPSHOT \
            -Dclassifier=tests \
            -Dpackaging=jar \
            -Dfile=/tmp/avatica-tests.jar


      # Step 3: Run Maven unit tests (Avatica only)
      - name: Run Avatica unit tests
        run: |
          cd avatica
          mvn -B clean verify -DskipITs=true -Dmaven.test.failure.ignore=true -s settings.xml
        
      - name: Generate Jacoco report
        run: |
          cd avatica
          mvn jacoco:report -s settings.xml
      
      # Step 4: Upload report
      - name: Upload Jacoco report
        uses: actions/upload-artifact@v4
        with:
          name: avatica-jacoco-reports-${{ github.ref_name }}
          path: 'avatica/**/target/site/jacoco*'
          
      #Step 5: Upload surefire reports to get failed test nr
      - name: Upload Surefire reports
        uses: actions/upload-artifact@v4
        with:
          name: avatica-surefire-reports-${{ github.ref_name }}
          path: 'avatica/**/target/surefire-reports'

